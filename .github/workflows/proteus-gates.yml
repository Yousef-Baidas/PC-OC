# .github/workflows/proteus-gates.yml — written by the Proteus scaffold ticket.
# Every PR into main or proteus/* runs the same gates the worker ran. Branch protection on
# proteus/<run> requires this job green plus one approving review (the verifier).
name: proteus-gates
on:
  pull_request:
    branches: ["main", "proteus/**"]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not the synthetic merge commit
          fetch-depth: 0
      # Same versions as the dev machine; hashes pinned from the upstream release assets.
      - name: install shellcheck, shfmt, bats
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSLo shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          curl -fsSLo bats.tar.gz https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          sha256sum -c <<'EOF'
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  sc.tar.xz
          76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt
          bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  bats.tar.gz
          EOF
          tar -xJf sc.tar.xz
          sudo install -m 0755 shellcheck-v0.11.0/shellcheck shfmt /usr/local/bin/
          tar -xzf bats.tar.gz
          sudo bats-core-1.14.0/install.sh /usr/local
      - name: gates
        run: checks/gates.sh
      - name: commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          for c in $(git rev-list "origin/$BASE_REF..HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg" && node teams/templates/hooks/commit-msg.js "$RUNNER_TEMP/msg" || exit 1
          done
