# .github/workflows/proteus-gates.yml — written by the Proteus scaffold ticket.
# Every PR into proteus/* runs the same gates the worker ran. Branch protection on
# proteus/<run> requires this job green plus one approving review (the verifier).
name: proteus-gates
on:
  pull_request:
    branches: ["proteus/**"]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the PR head, not the synthetic merge commit
          fetch-depth: 0
      # EDIT: one setup action for the stack, e.g.
      #   - uses: actions/setup-node@v4   with: { node-version: 22, cache: npm }
      #   - uses: astral-sh/setup-uv@v5
      #   - uses: dtolnay/rust-toolchain@stable
      - run: echo EDIT-install     # npm ci | uv sync | cargo fetch
      - run: echo EDIT-typecheck
      - run: echo EDIT-lint
      - run: echo EDIT-test
      - run: echo EDIT-deadcode    # npx fallow dead-code | vulture . --min-confidence 80 | cargo machete
      - name: commit messages
        run: |
          for c in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$c" > /tmp/msg && node teams/templates/hooks/commit-msg.js /tmp/msg || exit 1
          done
